task: detection

# COCO-style evaluator for bounding boxes
evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

# SPARK has 10 spacecraft categories
num_classes: 10
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    
    img_folder: data/spark-2024-train-val/images
    ann_file: data/annotations/spark_train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~     # transforms defined in include/dataloader.yml
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFuncion

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: data/spark-2024-train-val/images
    ann_file: data/annotations/spark_val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFuncion

